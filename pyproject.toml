[project]
name = "pixeltable-orchard-crates"
version = "0.1.0"
description = "Batch ETL for orchard harvest crates: CSV import/export, packing math, and moisture on_error handling - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "orchard-crates"]
dependencies = [
    "pixeltable>=0.7.16",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
